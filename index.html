<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05080b" />
<meta name="description" content="可拓展前端视频加音频框架" />
<title>可拓展前端视频加音频框架</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070b0f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%239fdcff' stroke-width='1.2'/%3E%3Cpath d='M16 16V9' stroke='%239fdcff' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 背景视频：真实地址由 app.js 从 assets/manifest.js 读取 -->
  <div class="bg-parallax" id="bgParallax" aria-hidden="true">
    <video
      id="bgVideo"
      class="bg-video"
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>
  </div>

  <!-- 背景音乐：真实地址由 app.js 从 assets/manifest.js 读取 -->
  <audio id="bgm" loop preload="auto"></audio>


  <div class="scrim" aria-hidden="true"></div>
  <div class="tint" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>


  <div class="gate is-loading" id="gate" role="dialog" aria-modal="true" aria-label="音画加载中" aria-busy="true" aria-disabled="true" tabindex="-1">
    <div class="gate__loading" id="gateLoading">
      <div class="loadbar" id="loadTrack" role="progressbar" aria-label="音画加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="loadbar__fill" id="loadFill"></span>
      </div>
      <p class="loadbar__text" id="loadText">正在加载音画 0%</p>
    </div>

    <span class="gate__enter" id="enterLabel" aria-hidden="true">点击进入</span>

    <div class="media-error" id="mediaError" role="alert">
      <p class="media-error__title" id="mediaErrorTitle">素材未就绪</p>
      <p class="media-error__text" id="mediaErrorText">请把 1 个视频和 1 个音频放入 assets 文件夹，然后双击“启动网页.bat”。</p>
      <p class="media-error__hint" id="mediaErrorHint">支持 MP4 / WebM / OGV / MOV / M4V 与 MP3 / WAV / OGG / M4A / AAC / FLAC / OPUS；除框架自带示例外，视频和音频请各保留一个。</p>
    </div>
  </div>

  <noscript><div class="noscript">请开启 JavaScript 以播放视频和音乐。</div></noscript>

  <script src="config.js"></script>
  <script src="assets/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
