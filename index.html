<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05080b" />
<meta name="description" content="半周年倒计时" />
<title>半周年倒计时</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070b0f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%239fdcff' stroke-width='1.2'/%3E%3Cpath d='M16 16V9' stroke='%239fdcff' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-parallax" id="bgParallax" aria-hidden="true">
    <video
      id="bgVideo"
      class="bg-video"
      src="assets/bg-video.mp4"
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>
  </div>

  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>


  <div class="scrim" aria-hidden="true"></div>
  <div class="tint" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>


  <div class="hud">

    <main class="core" id="core">

      <div class="eyebrow">
        <span class="eyebrow__rule"></span>
        <span class="eyebrow__text">距离活动开始还有</span>
        <span class="eyebrow__rule"></span>
      </div>

      <div class="clock" id="clock" role="timer" aria-label="倒计时">
        <div class="unit">
          <span class="value" id="days">--</span>
        </div>
        <span class="sep" aria-hidden="true"><i></i><i></i></span>
        <div class="unit">
          <span class="value" id="hours">--</span>
        </div>
        <span class="sep" aria-hidden="true"><i></i><i></i></span>
        <div class="unit">
          <span class="value" id="minutes">--</span>
        </div>
      </div>

    </main>

  </div>

  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="点击任意处进入" tabindex="0" autofocus>
    <span class="gate__enter" aria-hidden="true">点击进入</span>
  </div>

  <noscript><div class="noscript">请开启 JavaScript 以显示倒计时。</div></noscript>

  <script src="app.js"></script>
</body>
</html>
